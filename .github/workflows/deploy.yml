name: Deploy Vmetals

# Manual-trigger only: this repo isn't wired up to the AWS/EC2 deploy
# target (no AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_REGION/
# EC2_INSTANCE_ID/EC2_PUBLIC_IP secrets configured here on purpose).
# Kept as reference for the deploy shape used in the original repo.
# Switch back to `push: branches: [main]` once real secrets are added.
on:
  workflow_dispatch: {}

concurrency:
  group: vmetals-deploy
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'next.config.mjs'
            backend:
              - 'backend/**'

  deploy-backend:
    name: Deploy Backend (Strapi)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Backend via SSM
        id: ssm-backend
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Vmetals Backend Deploy - ${{ github.sha }}" \
            --parameters commands='[
              "set -e",
              "cd /var/www/vmetals",
              "sudo -u vmetals flock /tmp/vmetals-deploy.lock bash -lc \"cd /var/www/vmetals && git fetch origin main && git reset --hard origin/main\"",
              "cd backend",
              "sudo -u vmetals npm install --omit=dev",
              "sudo -u vmetals pm2 restart vmetals-backend",
              "sleep 5",
              "sudo -u vmetals pm2 status vmetals-backend"
            ]' \
            --timeout-seconds 300 \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Wait for Backend Deploy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm-backend.outputs.command_id }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i/30 - Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm-backend.outputs.command_id }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text
              echo "Backend deploy succeeded"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm-backend.outputs.command_id }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
          exit 1

  deploy-frontend:
    name: Deploy Frontend (Next.js)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Frontend via SSM
        id: ssm-frontend
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Vmetals Frontend Deploy - ${{ github.sha }}" \
            --parameters commands='[
              "set -e",
              "cd /var/www/vmetals",
              "sudo -u vmetals flock /tmp/vmetals-deploy.lock bash -lc \"cd /var/www/vmetals && git fetch origin main && git reset --hard origin/main\"",
              "sudo -u vmetals npm install --omit=dev",
              "sudo -u vmetals npm run build",
              "sudo -u vmetals pm2 restart ecosystem.config.js --env production",
              "sleep 10",
              "for i in 1 2 3 4 5 6; do HTTP=$(curl -s -o /dev/null -w \"%{http_code}\" http://localhost:4001); echo \"Health check attempt $i: $HTTP\"; if [ \"$HTTP\" = \"200\" ]; then echo \"Next.js is ready\"; exit 0; fi; sleep 5; done; echo \"Next.js failed to start\"; sudo -u vmetals pm2 logs v-metals --lines 20 --nostream; exit 1"
            ]' \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Wait for Frontend Deploy
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm-frontend.outputs.command_id }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i/60 - Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm-frontend.outputs.command_id }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text
              echo "Frontend deploy succeeded"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm-frontend.outputs.command_id }}" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
          exit 1

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always() && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') && (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')
    steps:
      - name: Check site is live
        run: |
          for i in $(seq 1 5); do
            HTTP_CODE=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 30 "https://www.vmetalsolutions.com")
            echo "Attempt $i - Site status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Site is live"
              exit 0
            fi
            sleep 10
          done
          echo "Site health check failed"
          exit 1
